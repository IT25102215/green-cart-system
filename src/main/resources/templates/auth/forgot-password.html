<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Forgot password — Green Cart')}"></head><body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container"><div class="auth-card">
  <h2 class="fw-bold text-center">Forgot password</h2>
  <p class="text-center text-muted">We'll email a secure reset link if the account exists</p>
  <div th:if="${success}" class="alert alert-success rounded-4 small" th:text="${success}"></div>
  <div th:if="${error}" class="alert alert-danger rounded-4" th:text="${error}"></div>
  <form th:action="@{/forgot-password}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <div class="mb-3"><label>Email</label><input type="email" name="email" class="form-control rounded-pill" required></div>
    <button class="btn-fresh w-100">Send reset link</button>
  </form>
  <div class="form-text mt-3"><strong>Local development note:</strong> SMTP is optional. If email is disabled, the reset URL is written to the IntelliJ application console.</div>
</div></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body></html>
