<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reset password — Green Cart')}"></head><body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container"><div class="auth-card">
  <h2 class="fw-bold text-center">Set new password</h2>
  <div th:if="${error}" class="alert alert-danger rounded-4" th:text="${error}"></div>
  <form th:action="@{/reset-password}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <input type="hidden" name="token" th:value="${token}">
    <div class="mb-3"><label>New password</label><input type="password" name="password" class="form-control rounded-pill" required minlength="8" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}" title="At least 8 characters with uppercase, lowercase, number and special character"></div>
    <div class="form-text mb-3">At least 8 characters with uppercase, lowercase, number and special character.</div><button class="btn-fresh w-100">Update password</button>
  </form>
</div></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body></html>
