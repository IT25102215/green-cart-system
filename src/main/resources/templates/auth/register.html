<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org">
<style>
  .heart {
    position: fixed;
    top: -10px;
    color: #ff4d6d;
    font-size: 40px;
    animation: fall linear forwards;
    pointer-events: none;
    z-index: 9999;
  }

  @keyframes fall {
    0% {
      transform: translateY(0) rotate(0deg);
      opacity: 1;
    }
    100% {
      transform: translateY(100vh) rotate(360deg);
      opacity: 0;
    }
  }
</style>
<head th:replace="~{fragments/layout :: head('Register — Green Cart')}"></head><body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">
  <div class="auth-card">
    <h2 class="fw-bold text-center mb-1">Create your account</h2>
    <p class="text-center text-muted">Join Green Cart in seconds</p>
    <div th:if="${error}" class="alert alert-danger rounded-4" th:text="${error}"></div>
    <form th:action="@{/register}" th:object="${registerDto}" method="post">
      <div class="mb-3"><label>Full name</label><input class="form-control rounded-pill" th:field="*{fullName}" required></div>
      <div class="mb-3"><label>Email</label><input type="email" class="form-control rounded-pill" th:field="*{email}" required></div>
      <div class="mb-3"><label>Password</label><input type="password" class="form-control rounded-pill" th:field="*{password}" required minlength="8" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}" title="At least 8 characters with uppercase, lowercase, number and special character"><div class="form-text">At least 8 characters with uppercase, lowercase, number and special character.</div><div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div></div>
      <div class="mb-3"><label>Phone</label><input class="form-control rounded-pill" th:field="*{phone}" type="tel" inputmode="numeric" pattern="[0-9]{10}" minlength="10" maxlength="10" required title="Enter exactly 10 digits" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)" placeholder="07XXXXXXXX"><div class="form-text">Exactly 10 digits, numbers only.</div><div class="text-danger small" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div></div>
      <div class="mb-3"><label>Address</label><input class="form-control rounded-pill" th:field="*{address}" required minlength="5" maxlength="255" placeholder="Enter your delivery address"><div class="form-text">This will be used as your default checkout delivery address.</div><div class="text-danger small" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div></div>
      <button class="btn-fresh w-100">Sign up</button>
    </form>
    <div class="text-center mt-3"><a th:href="@{/login}">Already have an account? Sign in</a></div>
  </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
  function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "🌿";

    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.animationDuration = (Math.random() * 3 + 2) + "s";
    heart.style.fontSize = (Math.random() * 10 + 10) + "px";

    document.body.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 5000);
  }

  setInterval(createHeart, 300);
</script>

</body></html>
