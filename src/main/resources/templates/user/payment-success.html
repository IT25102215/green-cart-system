<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Order Placed')}"></head><body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container my-5"><div class="auth-card text-center">
  <i class="bi bi-check-circle-fill text-success" style="font-size:5rem"></i>
  <h2 class="fw-bold mt-3">Order Placed!</h2>
  <p class="mb-2">Thank you. Order #<span th:text="${order.id}"></span> has been received.</p>
  <div class="alert alert-info rounded-4 text-start mt-3">
    <strong>Next step:</strong> Your order is <strong>PENDING</strong> until an administrator approves it.
    After approval, a delivery staff member will be assigned and you can follow delivery progress.
  </div>
  <div class="d-flex justify-content-center gap-2 flex-wrap mt-3">
    <a th:href="@{/orders}" class="btn-fresh">View Orders</a>
    <a th:href="@{/user/deliveries(orderId=${order.id})}" class="btn btn-outline-success rounded-pill px-4">Track Order</a>
  </div>
</div></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body></html>
