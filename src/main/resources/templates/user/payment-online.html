<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Online Payment — Green Cart')}"></head><body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container my-5">
  <div class="auth-card text-center">
    <h2 class="fw-bold">Pay with Stripe</h2>
    <p class="text-muted">Order #<span th:text="${order.id}"></span> — Total: <strong>Rs. <span th:text="${#numbers.formatDecimal(order.total,1,2)}"></span></strong></p>
    <p class="small text-muted">Demo mode — clicking below simulates a successful Stripe payment. Replace with real Stripe Checkout in production using the Stripe SDK.</p>
    <form th:action="@{/payment/process}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <input type="hidden" name="orderId" th:value="${order.id}">
      <button class="btn-fresh w-100">Pay Now</button>
    </form>
    <a th:href="@{/payment/cancel}" class="d-block mt-3 text-muted">Cancel</a>
  </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body></html>
