<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Admin — Site Reviews')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>
<div class="container-fluid"><div class="row">
  <div class="col-md-2 p-0 gc-admin-sidebar-col"><div th:replace="~{admin/_sidebar :: sidebar}"></div></div>
  <div class="col-md-10 p-4 gc-admin-content-col">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
      <div>
        <h1 class="fw-bold mb-1">Site Reviews</h1>
        <p class="text-muted mb-0">Moderate customer reviews about the GreenCart website and overall service.</p>
      </div>
      <span class="badge rounded-pill text-bg-warning px-3 py-2" th:text="|Pending: ${pendingSiteReviews}|">Pending: 0</span>
    </div>

    <div th:if="${#lists.isEmpty(siteReviews)}" class="gc-panel p-5 text-center text-muted">
      <i class="bi bi-chat-heart display-5 d-block mb-2"></i>
      No site reviews have been submitted yet.
    </div>

    <div class="row g-3" th:if="${!#lists.isEmpty(siteReviews)}">
      <div class="col-xl-6" th:each="r : ${siteReviews}">
        <div class="review-card h-100">
          <div class="d-flex justify-content-between gap-3 align-items-start">
            <div>
              <div class="star"><i th:each="i : ${#numbers.sequence(1,r.rating)}" class="bi bi-star-fill"></i></div>
              <strong class="d-block mt-2" th:text="${r.user != null ? r.user.fullName : 'Customer'}">Customer</strong>
              <small class="text-muted" th:text="${r.user != null ? r.user.email : ''}">email</small>
            </div>
            <span class="badge"
                  th:classappend="${r.status.name() == 'APPROVED'} ? ' text-bg-success' : (${r.status.name() == 'REJECTED'} ? ' text-bg-danger' : ' text-bg-warning')"
                  th:text="${r.status}">PENDING</span>
          </div>

          <p class="mt-3 mb-2" th:text="${r.comment}">Review</p>
          <div class="small text-muted mb-3">
            Submitted <span th:text="${#temporals.format(r.createdAt,'yyyy-MM-dd HH:mm')}">date</span>
            <span th:if="${r.moderatedAt != null}"> • Moderated <span th:text="${#temporals.format(r.moderatedAt,'yyyy-MM-dd HH:mm')}"></span></span>
          </div>

          <div class="d-flex flex-wrap gap-2">
            <form th:if="${r.status.name() != 'APPROVED'}" th:action="@{/admin/site-reviews/{id}/approve(id=${r.id})}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <button class="btn btn-sm btn-success" type="submit"><i class="bi bi-check-circle"></i> Approve</button>
            </form>
            <form th:if="${r.status.name() != 'REJECTED'}" th:action="@{/admin/site-reviews/{id}/reject(id=${r.id})}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <button class="btn btn-sm btn-outline-warning" type="submit"><i class="bi bi-x-circle"></i> Reject</button>
            </form>
            <form th:action="@{/admin/site-reviews/{id}/delete(id=${r.id})}" method="post" onsubmit="return confirm('Delete this site review?');">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash"></i> Delete</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
