<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin — Users')}"></head><body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container-fluid"><div class="row">
  <div class="col-md-2 p-0 gc-admin-sidebar-col"><div th:replace="~{admin/_sidebar :: sidebar}"></div></div>
  <div class="col-md-10 p-4 gc-admin-content-col">
    <h1 class="fw-bold">Users</h1>
    <div class="glass p-3 mt-3">
      <table class="table align-middle">
        <thead><tr><th>#</th><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead>
        <tbody>
          <tr th:each="u : ${users}">
            <td th:text="${u.id}"></td>
            <td th:text="${u.fullName}"></td>
            <td th:text="${u.email}"></td>
            <td><span class="badge bg-info" th:text="${u.role}"></span></td>
            <td>
              <span class="badge bg-success" th:if="${u.enabled}">Active</span>
              <span class="badge bg-danger" th:unless="${u.enabled}">Blocked</span>
            </td>
            <td>
              <form th:action="@{/admin/users/{id}/toggle(id=${u.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-sm btn-outline-warning" th:text="${u.enabled ? 'Block' : 'Unblock'}"></button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body></html>
