<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin — Reviews')}"></head><body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container-fluid"><div class="row">
  <div class="col-md-2 p-0 gc-admin-sidebar-col"><div th:replace="~{admin/_sidebar :: sidebar}"></div></div>
  <div class="col-md-10 p-4 gc-admin-content-col">
    <h1 class="fw-bold">Reviews</h1>
    <div class="row g-3 mt-2">
      <div class="col-md-6" th:each="r : ${reviews}">
        <div class="review-card">
          <div class="d-flex justify-content-between">
            <div class="star"><i th:each="i : ${#numbers.sequence(1,r.rating)}" class="bi bi-star-fill"></i></div>
            <small class="text-muted" th:text="${r.user != null ? r.user.fullName : 'Anon'}"></small>
          </div>
          <p class="mt-2 mb-1" th:text="${r.comment}"></p><small class="text-muted" th:if="${r.order != null}" th:text="|Order #${r.order.id} • ${#temporals.format(r.createdAt,'yyyy-MM-dd HH:mm')}|">Order</small>
          <form th:action="@{/admin/reviews/{id}/delete(id=${r.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn btn-sm btn-outline-danger">Remove</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body></html>
