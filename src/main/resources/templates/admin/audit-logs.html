<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Audit Logs')}"></head><body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container-fluid"><div class="row">
  <div class="col-md-2 p-0 gc-admin-sidebar-col"><div th:replace="~{admin/_sidebar :: sidebar}"></div></div>
  <main class="col-md-10 p-4 gc-admin-content-col">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
      <div><h1 class="fw-bold mb-1">System Audit Logs</h1><p class="text-muted mb-0">Who changed what, including old/new values for tracked changes.</p></div>
      <span class="badge bg-dark">Latest 200</span>
    </div>
    <div class="glass p-3 table-responsive mt-3">
      <table class="table align-middle">
        <thead><tr><th>User</th><th>Action</th><th>Entity</th><th>Old Value</th><th>New Value</th><th>Details</th><th>Date</th></tr></thead>
        <tbody>
          <tr th:each="l : ${logs}">
            <td><strong th:text="${l.actorEmail}"></strong><small class="d-block text-muted" th:text="${l.module}"></small></td>
            <td><span class="badge bg-secondary" th:text="${l.action}"></span></td>
            <td th:text="|${l.entityType} #${l.entityId != null ? l.entityId : '-'}|"></td>
            <td><code th:text="${l.oldValue != null ? l.oldValue : '-'}"></code></td>
            <td><code th:text="${l.newValue != null ? l.newValue : '-'}"></code></td>
            <td style="max-width:420px" th:text="${l.description}"></td>
            <td class="text-nowrap" th:text="${#temporals.format(l.createdAt,'yyyy-MM-dd HH:mm:ss')}"></td>
          </tr>
          <tr th:if="${#lists.isEmpty(logs)}"><td colspan="7" class="text-center text-muted py-4">No audit records yet.</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body></html>
