<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Shop — Green Cart')}"></head><body class="gc-shop-page">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container my-5 gc-shop-shell">
  <div class="gc-shop-toolbar mb-4">
    <div>
      <span class="gc-shop-eyebrow">Fresh groceries, easy shopping</span>
      <h1 class="fw-bold mb-1">Shop Groceries</h1>
      <p class="text-muted mb-0 small">Browse products, filter by category and find what you need quickly.</p>
    </div>
    <form class="gc-shop-filter" method="get" th:action="@{/shop}">
      <select name="category" class="form-select">
        <option value="">All categories</option>
        <option th:each="c : ${allCategories}" th:value="${c.id}" th:text="${c.name}" th:selected="${selectedCategory != null and selectedCategory == c.id}"></option>
      </select>
      <div class="gc-shop-search-wrap"><i class="bi bi-search"></i><input class="form-control" name="q" th:value="${q}" placeholder="Search products…" aria-label="Search products"></div>
      <button class="btn-fresh" type="submit"><i class="bi bi-funnel"></i> Filter</button>
      <a th:if="${(q != null and !q.isBlank()) or selectedCategory != null}" th:href="@{/shop}" class="btn btn-outline-secondary gc-clear-filter" title="Clear filters"><i class="bi bi-x-lg"></i></a>
    </form>
  </div>
  <div class="row g-4">
    <div class="col-6 col-md-4 col-lg-2 fade-in-target" th:each="p : ${products}">
      <div class="product-card">
        <a th:href="@{/shop/{id}(id=${p.id})}" class="gc-shop-product-image"><img th:src="${p.image}" th:alt="${p.name}" data-product-image loading="lazy"></a>
        <div class="body">
          <small class="text-muted" th:text="${p.category != null ? p.category.name : ''}"></small>
          <h6 th:text="${p.name}" class="mt-1"></h6>
          <div class="mb-2">
            <span th:if="${p.stock == 0}" class="gc-status-badge status-cancelled"><span class="gc-status-dot"></span>OUT OF STOCK</span>
            <span th:if="${p.stock > 0 and p.stock <= 10}" class="gc-status-badge status-pending"><span class="gc-status-dot"></span>LOW STOCK</span>
            <span th:if="${p.stock > 10}" class="gc-status-badge status-delivered"><span class="gc-status-dot"></span>IN STOCK</span>
          </div>
          <div class="d-flex justify-content-between align-items-end mt-auto gap-2">
            <div>
              <span class="price">Rs. <span th:text="${#numbers.formatDecimal(p.finalPrice,1,2)}"></span></span>
              <small th:if="${p.onSale}" class="d-block text-muted text-decoration-line-through">Rs. <span th:text="${#numbers.formatDecimal(p.price,1,2)}"></span></small>
            </div>
            <span th:if="${p.onSale}" class="badge-discount" th:text="|-${p.discount.stripTrailingZeros().toPlainString()}%|"></span>
          </div>
          <form th:action="@{/cart/add/{id}(id=${p.id})}" method="post" class="mt-3" data-cart-add-form>
            <button class="btn-fresh w-100" th:disabled="${p.stock == 0}"><i class="bi bi-cart-plus"></i> <span th:text="${p.stock == 0 ? 'Unavailable' : 'Add'}">Add</span></button>
          </form>
        </div>
      </div>
    </div>
  </div>
  <div th:if="${#lists.isEmpty(products)}" class="gc-shop-empty">
    <i class="bi bi-basket3"></i>
    <h5>No products found</h5>
    <p>Try another search or clear the current filters.</p>
    <a th:href="@{/shop}" class="btn btn-outline-success rounded-pill px-4">View All Products</a>
  </div>
  <nav class="mt-5" th:if="${totalPages > 1}">
    <ul class="pagination gc-pagination justify-content-center">
      <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages-1)}" th:classappend="${i == page}? 'active'">
        <a class="page-link" th:href="@{/shop(page=${i},q=${q},category=${selectedCategory})}" th:text="${i+1}"></a>
      </li>
    </ul>
  </nav>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer><div th:replace="~{fragments/layout :: scripts}"></div>
</body></html>
