<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categories — Green Cart')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container my-5">
  <div class="text-center mb-5">
    <h1 class="fw-bold">Shop by Category</h1>
    <p class="text-muted mb-0">Choose a category and explore products grouped in one place.</p>
  </div>
  <section th:each="entry : ${categoryGroups}" class="mb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div><h2 class="fw-bold mb-1" th:text="${entry.key.name}">Category</h2></div>
      <a class="btn btn-outline-success rounded-pill" th:href="@{/shop(category=${entry.key.id})}">View All <i class="bi bi-arrow-right"></i></a>
    </div>
    <div class="row g-4">
      <div class="col-6 col-md-4 col-lg-2" th:each="p, pStat : ${entry.value}" th:if="${pStat.index < 6}">
        <div class="product-card h-100">
          <a th:href="@{/shop/{id}(id=${p.id})}"><img th:src="${p.image}" th:alt="${p.name}"></a>
          <div class="body d-flex flex-column">
            <h6 th:text="${p.name}"></h6>
            <div class="mt-auto">
              <div class="d-flex justify-content-between align-items-end gap-2">
                <div>
                  <span class="price">Rs. <span th:text="${#numbers.formatDecimal(p.finalPrice,1,2)}"></span></span>
                  <small th:if="${p.onSale}" class="d-block text-muted text-decoration-line-through">Rs. <span th:text="${#numbers.formatDecimal(p.price,1,2)}"></span></small>
                </div>
                <span th:if="${p.onSale}" class="badge-discount" th:text="|-${p.discount.stripTrailingZeros().toPlainString()}%|"></span>
              </div>
              <form th:action="@{/cart/add/{id}(id=${p.id})}" method="post" class="mt-2" data-cart-add-form><button class="btn-fresh w-100"><i class="bi bi-cart-plus"></i> Add</button></form>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="text-center text-muted py-3" th:if="${#lists.isEmpty(entry.value)}">No products in this category yet.</div>
  </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body></html>
