<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- 🌿 Falling leaf CSS -->
<style>
  .heart {
    position: fixed;
    top: -10px;
    color: #ff4d6d;
    font-size: 40px;
    animation: fall linear forwards;
    pointer-events: none;
    z-index: 9999;
  }

  @keyframes fall {
    0% {
      transform: translateY(0) rotate(0deg);
      opacity: 1;
    }
    100% {
      transform: translateY(100vh) rotate(360deg);
      opacity: 0;
    }
  }
</style>

<head th:replace="~{fragments/layout :: head('Login — Green Cart')}">

</head>

<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
  <div class="auth-card">
    <h2 class="fw-bold text-center mb-1">Welcome back</h2>
    <p class="text-center text-muted">Sign in to continue shopping</p>

    <div th:if="${param.error}" class="alert alert-danger rounded-4">
      Invalid credentials.
    </div>

    <div th:if="${param.logout}" class="alert alert-success rounded-4">
      You have been logged out.
    </div>

    <div th:if="${success}" class="alert alert-success rounded-4" th:text="${success}"></div>

    <form th:action="@{/login}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

      <div class="mb-3">
        <label>Email</label>
        <input type="email" name="username" class="form-control rounded-pill" required>
      </div>

      <div class="mb-3">
        <label>Password</label>
        <input type="password" name="password" class="form-control rounded-pill" required>
      </div>

      <button class="btn-fresh w-100">Sign in</button>
    </form>

    <div class="text-center mt-3">
      <a th:href="@{/forgot-password}">Forgot password?</a> ·
      <a th:href="@{/register}">Create account</a>
    </div>

    <div class="alert alert-info rounded-4 mt-4 small">
      <strong>Demo accounts</strong><br>
      Admin: admin@greencart.com / Admin@123<br>
      User: user@greencart.com / User@123
    </div>
  </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>

<!-- 🌿 Falling leaf Script -->
<script>
  function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "🌿";

    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.animationDuration = (Math.random() * 3 + 2) + "s";
    heart.style.fontSize = (Math.random() * 10 + 10) + "px";

    document.body.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 5000);
  }

  setInterval(createHeart, 300);
</script>

</body>
</html>
