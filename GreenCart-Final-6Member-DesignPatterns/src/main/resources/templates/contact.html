<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Contact — Green Cart')}"></head><body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container my-5">
  <div th:replace="~{fragments/layout :: flash}"></div>
  <div class="row g-4">
    <div class="col-lg-6" id="store-location">
      <h1 class="fw-bold">Get in touch</h1>
      <p class="text-muted">Send a message to Green Cart support. Your inquiry is saved in the system so the support team can respond.</p>
      <p><i class="bi bi-geo-alt-fill text-success"></i> 123 Market Street, Colombo</p>
      <p><i class="bi bi-telephone-fill text-success"></i> 011 2 345 678</p>
      <p><i class="bi bi-envelope-fill text-success"></i> support@greencart.com</p>
      <div class="alert alert-light border rounded-4 mt-4">
        <strong><i class="bi bi-clock"></i> Support hours</strong><br>
        Monday–Saturday, 8:00 AM–6:00 PM
      </div>
    </div>
    <div class="col-lg-6">
      <div class="glass p-4">
        <h4 class="fw-bold mb-3">Send a message</h4>
        <form th:action="@{/contact}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <input class="form-control mb-3 rounded-pill" name="name" maxlength="100" placeholder="Your name" required>
          <input class="form-control mb-3 rounded-pill" name="email" type="email" maxlength="254" placeholder="Your email" required>
          <input class="form-control mb-3 rounded-pill" name="phone" inputmode="numeric" pattern="\d{10}" maxlength="10" minlength="10" placeholder="Phone number (10 digits)" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)" required>
          <input class="form-control mb-3 rounded-pill" name="subject" minlength="3" maxlength="150" placeholder="Subject" required>
          <textarea class="form-control mb-3 rounded-4" name="message" minlength="5" maxlength="2000" rows="5" placeholder="Message" required></textarea>
          <button class="btn-fresh w-100" type="submit">Send message</button>
        </form>
      </div>
    </div>
  </div>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer><div th:replace="~{fragments/layout :: scripts}"></div>
</body></html>
