<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('My Account — Green Cart')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>
<div class="container my-5">
  <div class="text-center mb-4">
    <span class="badge rounded-pill text-bg-success px-3 py-2">GREEN CART ACCOUNT</span>
    <h1 class="fw-bold mt-3 mb-2">My Account</h1>
    <p class="text-muted mb-0" th:if="${currentUser != null}">Welcome, <strong th:text="${currentUser.fullName}">User</strong>.</p>
  </div>

  <div class="row justify-content-center g-4">
    <div class="col-md-8 col-lg-6">
      <div class="glass p-4 p-md-5 text-center">
        <div class="display-4 text-success mb-3"><i class="bi bi-person-circle"></i></div>
        <h3 class="fw-bold">Account Settings</h3>
        <p class="text-muted">Manage your account and quickly return to the area you need.</p>
        <div class="d-flex justify-content-center flex-wrap gap-2 mb-3">
          <a th:href="@{/profile}" class="btn btn-outline-success rounded-pill" sec:authorize="hasRole('USER')"><i class="bi bi-person"></i> Profile</a>
          <a th:href="@{/orders}" class="btn btn-outline-success rounded-pill" sec:authorize="hasRole('USER')"><i class="bi bi-receipt"></i> My Orders</a>
          <a th:href="@{/reviews}" class="btn btn-outline-success rounded-pill" sec:authorize="hasRole('USER')"><i class="bi bi-bag-check"></i> Order Reviews</a>
          <a th:href="@{/site-reviews}" class="btn btn-outline-success rounded-pill" sec:authorize="hasRole('USER')"><i class="bi bi-chat-heart"></i> Rate GreenCart</a>
          <a th:href="@{/user/feedback}" class="btn btn-outline-success rounded-pill" sec:authorize="hasRole('USER')"><i class="bi bi-headset"></i> Help &amp; Support</a>
          <a th:href="@{/user/deliveries}" class="btn btn-outline-success rounded-pill" sec:authorize="hasRole('USER')"><i class="bi bi-truck"></i> Track Orders</a>
        </div>
        <form th:action="@{/logout}" method="post" class="mt-3">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <button type="submit" class="btn btn-danger rounded-pill px-4"><i class="bi bi-box-arrow-right"></i> Logout</button>
        </form>
      </div>
    </div>
  </div>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer><div th:replace="~{fragments/layout :: scripts}"></div>
</body></html>
