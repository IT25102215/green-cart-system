spring.application.name=Green Cart
server.port=8080

server.error.whitelabel.enabled=false
server.error.path=/error
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

# ============================================================
# MYSQL / MYSQL WORKBENCH DATABASE
# ============================================================
# Default database name matches the IT2140 report.
# You can override any value using DB_URL, DB_USERNAME and DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/grocery_ordering?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo&characterEncoding=UTF-8}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect.storage_engine=innodb

# Run data.sql only after Hibernate has created/updated the tables.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false

spring.thymeleaf.cache=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=./uploads
app.upload.dir=./uploads

app.stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_dummy}
app.stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:pk_test_dummy}

# Green Cart currency
app.currency=LKR
app.currency-symbol=Rs.
app.usd-to-lkr-rate=335

# ============================================================
# OPTIONAL EMAIL / SMTP
# ============================================================
# Leave MAIL_ENABLED=false for local development. Reset links are then written
# to the application log instead of being exposed in the browser UI.
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@greencart.local}
app.mail.support-to=${MAIL_SUPPORT_TO:support@greencart.local}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}

# Inventory alert threshold
app.inventory.low-stock-threshold=${LOW_STOCK_THRESHOLD:10}
